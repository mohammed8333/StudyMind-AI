services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studymind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studymind_secret}
      POSTGRES_DB: ${POSTGRES_DB:-studymind_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studymind} -d ${POSTGRES_DB:-studymind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
